<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma App - Python & Actions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #38bdf8; }
        p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 24px; }
        .input-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #cbd5e1; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        button:hover { background-color: #0369a1; }
        .result-box { margin-top: 20px; padding: 14px; background-color: #064e3b; border: 1px solid #10b981; border-radius: 8px; color: #a7f3d0; font-weight: 600; display: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>➕ Suma App</h1>
    <p>Ingresa dos números para calcular el resultado</p>
    <div class="input-group">
        <label for="num1">Primer Número</label>
        <input type="number" id="num1" placeholder="Ej. 15" step="any">
    </div>
    <div class="input-group">
        <label for="num2">Segundo Número</label>
        <input type="number" id="num2" placeholder="Ej. 25" step="any">
    </div>
    <button onclick="realizarSuma()">Sumar Números</button>
    <div id="resultado" class="result-box"></div>
</div>

<script>
    function realizarSuma() {
        const n1 = parseFloat(document.getElementById('num1').value);
        const n2 = parseFloat(document.getElementById('num2').value);
        const resDiv = document.getElementById('resultado');

        if (!isNaN(n1) && !isNaN(n2)) {
            const suma = n1 + n2;
            resDiv.innerText = `La suma de ${n1} y ${n2} es: ${suma}`;
            resDiv.style.display = 'block';
        } else {
            resDiv.innerText = '⚠️ Por favor ingresa dos números válidos';
            resDiv.style.display = 'block';
        }
    }
</script>
</body>
</html>
