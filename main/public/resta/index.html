<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resta App - Django & Actions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #1e1e38; border: 1px solid #7c3aed; padding: 30px; border-radius: 20px; box-shadow: 0 0 25px rgba(124, 58, 237, 0.3); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 1.6rem; margin-bottom: 8px; color: #c084fc; }
        p { font-size: 0.9rem; color: #a78bfa; margin-bottom: 24px; }
        .input-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #ddd6fe; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #5b21b6; background-color: #0f172a; color: #fff; font-size: 1rem; outline: none; transition: all 0.2s; }
        input:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 8px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4); }
        .result-box { margin-top: 20px; padding: 14px; background-color: #4c1d95; border: 1px solid #a855f7; border-radius: 10px; color: #f3e8ff; font-weight: 600; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>➖ Resta App</h1>
        <p>Ingresa dos números para calcular la diferencia</p>
        <div class="input-group">
            <label for="num1">Primer Número</label>
            <input type="number" id="num1" placeholder="Ej. 20" step="any">
        </div>
        <div class="input-group">
            <label for="num2">Segundo Número</label>
            <input type="number" id="num2" placeholder="Ej. 5" step="any">
        </div>
        <button onclick="realizarResta()">Restar Números</button>
        <div id="resultado" class="result-box"></div>
    </div>

    <script>
        function realizarResta() {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const resDiv = document.getElementById('resultado');

            if (!isNaN(n1) && !isNaN(n2)) {
                const diferencia = n1 - n2;
                resDiv.innerText = `La resta de ${n1} menos ${n2} es: ${diferencia}`;
                resDiv.style.display = 'block';
            } else {
                resDiv.innerText = '⚠️ Por favor ingresa dos números válidos';
                resDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
