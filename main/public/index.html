<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-App Python & Actions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 16px; text-align: center; max-width: 400px; width: 100%; }
        h1 { margin-bottom: 20px; color: #38bdf8; }
        .btn { display: block; padding: 14px; margin: 12px 0; border-radius: 10px; font-weight: bold; text-decoration: none; color: white; transition: 0.2s; }
        .btn-suma { background: #0284c7; }
        .btn-resta { background: #7c3aed; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Mis Aplicaciones</h1>
        <a href="./suma/" class="btn btn-suma">➕ Ir a App de Suma</a>
        <a href="./resta/" class="btn btn-resta">➖ Ir a App de Resta</a>
    </div>
</body>
</html>
