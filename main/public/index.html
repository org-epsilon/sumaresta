<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-App Python & Actions</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #64748b;
            --surface: #ffffff;
            --blue: #2563eb;
            --violet: #7c3aed;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--ink);
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe 52%, #fce7f3);
        }
        .card {
            width: min(760px, 100%);
            padding: 48px;
            text-align: center;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(59, 46, 104, 0.2);
        }
        .badge {
            display: inline-block;
            margin-bottom: 16px;
            padding: 8px 14px;
            color: var(--blue);
            background: #dbeafe;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        h1 { margin-bottom: 12px; font-size: clamp(2rem, 5vw, 3rem); }
        .intro { margin: 0 auto 32px; max-width: 500px; color: var(--muted); }
        .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
        .btn {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 24px 18px;
            color: white;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn strong { font-size: 1.15rem; }
        .btn span { font-size: 0.85rem; font-weight: 400; opacity: 0.9; }
        .btn-suma { background: linear-gradient(135deg, #2563eb, #06b6d4); }
        .btn-resta { background: linear-gradient(135deg, #7c3aed, #db2777); }
        .btn:hover { transform: translateY(-4px); box-shadow: 0 14px 24px rgba(37, 48, 96, 0.2); }
        @media (max-width: 560px) {
            .card { padding: 32px 20px; }
            .options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge">Herramientas rápidas</div>
        <h1>Mis aplicaciones</h1>
        <p class="intro">Elige una operación para comenzar. Ambas aplicaciones funcionan directamente desde tu navegador.</p>
        <div class="options">
            <a href="./suma/" class="btn btn-suma">
                <strong>+ Suma</strong>
                <span>Calcula la suma de dos números</span>
            </a>
            <a href="./resta/" class="btn btn-resta">
                <strong>- Resta</strong>
                <span>Calcula la diferencia entre dos números</span>
            </a>
        </div>
    </main>
</body>
</html>
